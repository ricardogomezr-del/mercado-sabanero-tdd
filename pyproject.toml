[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mercado-sabanero"
version = "1.0.0"
description = "Logica de compras y pruebas TDD - actividad individual"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["mercado_sabanero*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
